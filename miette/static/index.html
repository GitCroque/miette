<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Miette</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Miette">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#f7efe2" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1f1a15" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="/static/icon-180.png">
  <style>
    :root {
      --paper: #f7efe2;
      --card: #fffaf2;
      --ink: #2b231c;
      --soft: #7a6a5a;
      --line: #e6d8c3;
      --accent: #d9603b;
      --accent-ink: #ffffff;
      --ok: #2f7d4f;
      --warn: #b7791f;
      --bad: #b83a2e;
      --radius: 22px;
      color-scheme: light dark;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --paper: #1f1a15;
        --card: #2a231d;
        --ink: #f3e9dc;
        --soft: #b3a38f;
        --line: #3d342b;
        --accent: #ec7a52;
        --ok: #5fbf85;
        --warn: #e0a84a;
        --bad: #ec6a5c;
      }
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; background: var(--paper); color: var(--ink); }
    body {
      font: 18px/1.45 ui-rounded, "SF Pro Rounded", system-ui, -apple-system, sans-serif;
      padding: max(16px, env(safe-area-inset-top)) 16px max(28px, env(safe-area-inset-bottom));
      max-width: 560px;
      margin: 0 auto;
    }
    header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 4px 0 18px; }
    h1 { font-size: 34px; margin: 0; letter-spacing: -0.5px; }
    h1 span { color: var(--accent); }
    .pill {
      display: inline-flex; align-items: center; gap: 8px;
      font-size: 15px; padding: 7px 12px; border-radius: 999px;
      background: var(--card); border: 1px solid var(--line); color: var(--soft);
      max-width: 60%; text-align: right;
    }
    .pill::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--soft); flex: none; }
    .pill.ok::before { background: var(--ok); }
    .pill.warn::before { background: var(--warn); }
    .pill.bad::before { background: var(--bad); }
    section { margin-bottom: 22px; }
    label.title { display: block; font-size: 15px; color: var(--soft); margin: 0 0 8px 4px; }
    .who { display: flex; gap: 10px; }
    input[type=text] {
      flex: 1; min-width: 0; font: inherit; font-size: 20px; color: var(--ink);
      padding: 14px 16px; border-radius: 16px; border: 1px solid var(--line); background: var(--card);
    }
    input[type=text]:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
    .seg { display: flex; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 4px; }
    .seg button {
      font: inherit; font-size: 17px; border: 0; background: none; color: var(--soft);
      padding: 0 16px; border-radius: 12px; min-height: 48px;
    }
    .seg button[aria-pressed=true] { background: var(--accent); color: var(--accent-ink); }
    .themes { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .theme {
      font: inherit; font-size: 18px; font-weight: 600; color: var(--ink);
      display: flex; flex-direction: column; align-items: flex-start; justify-content: flex-end; gap: 6px;
      min-height: 104px; padding: 14px 16px; text-align: left;
      background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
      transition: transform .08s ease;
    }
    .theme .emoji { font-size: 34px; line-height: 1; }
    .theme:active { transform: scale(.97); }
    .theme.surprise { grid-column: span 2; min-height: 72px; flex-direction: row; align-items: center; justify-content: center; background: var(--accent); color: var(--accent-ink); border-color: transparent; }
    .theme.surprise .emoji { font-size: 26px; }
    .other { display: flex; gap: 10px; margin-top: 12px; }
    .go {
      font: inherit; font-weight: 700; font-size: 18px; border: 0; border-radius: 16px;
      padding: 0 20px; min-height: 54px; background: var(--ink); color: var(--paper);
    }
    button:disabled { opacity: .45; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; }
    .card h2 { margin: 0 0 10px; font-size: 22px; }
    .card p { margin: 0 0 10px; font-family: Georgia, "Times New Roman", serif; font-size: 18px; }
    .card .actions { display: flex; justify-content: flex-end; margin-top: 6px; }
    .ghost {
      font: inherit; font-size: 16px; font-weight: 600; color: var(--accent);
      background: none; border: 1px solid var(--line); border-radius: 12px; padding: 0 14px; min-height: 44px;
    }
    ul.history { list-style: none; margin: 0; padding: 0; }
    ul.history li { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 2px; border-bottom: 1px solid var(--line); }
    ul.history li:last-child { border-bottom: 0; }
    ul.history .t { font-weight: 600; }
    ul.history .d { font-size: 14px; color: var(--soft); }
    .notice { font-size: 15px; color: var(--soft); text-align: center; margin-top: 8px; }
    .error { background: color-mix(in srgb, var(--bad) 12%, var(--card)); border-color: color-mix(in srgb, var(--bad) 40%, var(--line)); color: var(--ink); }
    .overlay {
      position: fixed; inset: 0; display: none; align-items: center; justify-content: center; flex-direction: column; gap: 18px;
      background: color-mix(in srgb, var(--paper) 88%, transparent); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
      font-size: 20px; font-weight: 600; text-align: center; padding: 24px; z-index: 10;
    }
    .overlay.on { display: flex; }
    .ticket {
      width: 88px; height: 120px; background: var(--card); border: 1px solid var(--line); border-radius: 8px 8px 2px 2px;
      position: relative; overflow: hidden; animation: feed 1.6s ease-in-out infinite;
    }
    .ticket::before, .ticket::after { content: ""; position: absolute; left: 14px; right: 14px; height: 6px; border-radius: 3px; background: var(--line); }
    .ticket::before { top: 22px; }
    .ticket::after { top: 40px; right: 34px; }
    @keyframes feed { 0% { transform: translateY(-14px); } 50% { transform: translateY(6px); } 100% { transform: translateY(-14px); } }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <header>
    <h1>Miette<span>.</span></h1>
    <div class="pill" id="status" role="status">…</div>
  </header>

  <section>
    <label class="title" for="name">Pour qui ?</label>
    <div class="who">
      <input type="text" id="name" autocomplete="off" autocapitalize="words" placeholder="Prénom" maxlength="30">
      <div class="seg" role="group" aria-label="Accord">
        <button type="button" data-pronoun="elle" aria-pressed="true">elle</button>
        <button type="button" data-pronoun="il" aria-pressed="false">il</button>
      </div>
    </div>
  </section>

  <section>
    <label class="title">Une histoire sur…</label>
    <div class="themes">
      <button class="theme" data-theme="les dinosaures"><span class="emoji">🦕</span>Les dinosaures</button>
      <button class="theme" data-theme="la mer"><span class="emoji">🌊</span>La mer</button>
      <button class="theme" data-theme="le chat de la maison"><span class="emoji">🐈</span>Le chat de la maison</button>
      <button class="theme" data-theme="la forêt"><span class="emoji">🌳</span>La forêt</button>
      <button class="theme" data-theme="l'espace"><span class="emoji">🚀</span>L'espace</button>
      <button class="theme" data-theme="la ferme"><span class="emoji">🐄</span>La ferme</button>
      <button class="theme surprise" data-theme=""><span class="emoji">✨</span>Surprise</button>
    </div>
    <form class="other" id="other">
      <input type="text" id="custom" placeholder="Autre thème…" maxlength="80" autocomplete="off">
      <button class="go" type="submit">Go</button>
    </form>
  </section>

  <section id="result" hidden>
    <div class="card" id="result-card">
      <h2 id="result-title"></h2>
      <div id="result-text"></div>
      <div class="actions"><button class="ghost" id="result-reprint" hidden>Réimprimer</button></div>
    </div>
  </section>

  <section id="past" hidden>
    <label class="title">Dernières histoires</label>
    <div class="card"><ul class="history" id="history"></ul></div>
  </section>

  <p class="notice" id="notice"></p>

  <div class="overlay" id="overlay" aria-live="polite">
    <div class="ticket"></div>
    <div id="overlay-text">Miette écrit l'histoire…</div>
  </div>

  <script>
    const $ = (selector) => document.querySelector(selector);
    const store = {
      get(key, fallback) { try { return localStorage.getItem(key) ?? fallback; } catch { return fallback; } },
      set(key, value) { try { localStorage.setItem(key, value); } catch {} },
    };

    let pronoun = store.get("miette.pronom", "elle");
    let busy = false;
    const nameInput = $("#name");
    nameInput.value = store.get("miette.prenom", "");
    nameInput.addEventListener("input", () => store.set("miette.prenom", nameInput.value.trim()));

    function setPronoun(value) {
      pronoun = value;
      store.set("miette.pronom", value);
      document.querySelectorAll("[data-pronoun]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.pronoun === value)));
    }
    document.querySelectorAll("[data-pronoun]").forEach((b) => b.addEventListener("click", () => setPronoun(b.dataset.pronoun)));
    setPronoun(pronoun);

    function escapeHtml(text) {
      return text.replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }

    function when(iso) {
      const d = new Date(iso);
      return d.toLocaleDateString("fr-FR", { weekday: "long", day: "numeric", month: "long" }) + ", " +
        d.toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" });
    }

    function setBusy(on, text) {
      busy = on;
      $("#overlay").classList.toggle("on", on);
      if (text) $("#overlay-text").textContent = text;
      document.querySelectorAll(".theme, .go, .ghost").forEach((b) => (b.disabled = on));
    }

    function showResult(title, text, id, isError) {
      $("#result").hidden = false;
      $("#result-card").classList.toggle("error", !!isError);
      $("#result-title").textContent = title;
      $("#result-text").innerHTML = text.split(/\n\s*\n/).map((p) => `<p>${escapeHtml(p)}</p>`).join("");
      const reprint = $("#result-reprint");
      reprint.hidden = !id;
      reprint.onclick = id ? () => reprintStory(id) : null;
      $("#result").scrollIntoView({ behavior: "smooth", block: "start" });
    }

    async function call(url, body) {
      const response = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: body ? JSON.stringify(body) : undefined,
      });
      let data = {};
      try { data = await response.json(); } catch {}
      if (!response.ok) throw new Error(data.detail || `Erreur ${response.status}`);
      return data;
    }

    async function newStory(theme) {
      if (busy) return;
      setBusy(true, "Miette écrit l'histoire…");
      const slow = setTimeout(() => $("#overlay-text").textContent = "Presque… le ticket arrive.", 6000);
      try {
        const data = await call("/api/histoire", { theme, prenom: nameInput.value.trim(), pronom: pronoun });
        showResult(data.titre, data.texte, data.id, false);
      } catch (error) {
        showResult("Pas d'histoire cette fois", error.message, null, true);
      } finally {
        clearTimeout(slow);
        setBusy(false);
        refresh();
      }
    }

    async function reprintStory(id) {
      if (busy) return;
      setBusy(true, "Réimpression…");
      try {
        await call(`/api/reimprimer/${id}`);
      } catch (error) {
        showResult("Réimpression impossible", error.message, null, true);
      } finally {
        setBusy(false);
        refresh();
      }
    }

    document.querySelectorAll(".theme").forEach((b) => b.addEventListener("click", () => newStory(b.dataset.theme)));
    $("#other").addEventListener("submit", (event) => {
      event.preventDefault();
      const theme = $("#custom").value.trim();
      if (theme) newStory(theme);
    });

    async function refresh() {
      try {
        const response = await fetch("/api/etat");
        const state = await response.json();
        const pill = $("#status");
        pill.textContent = state.imprimante;
        pill.className = "pill " + (!state.prete ? "bad" : state.papier_bas ? "warn" : "ok");

        const list = $("#history");
        list.innerHTML = "";
        state.histoires.forEach((h) => {
          const li = document.createElement("li");
          li.innerHTML = `<div><div class="t">${escapeHtml(h.titre)}</div><div class="d">${escapeHtml(when(h.date))}</div></div>`;
          const button = document.createElement("button");
          button.className = "ghost";
          button.textContent = "Réimprimer";
          button.disabled = busy;
          button.addEventListener("click", () => reprintStory(h.id));
          li.appendChild(button);
          list.appendChild(li);
        });
        $("#past").hidden = state.histoires.length === 0;

        const notes = [];
        if (!state.cle) notes.push("Clé OpenRouter absente : aucune histoire ne peut être écrite.");
        notes.push(`${state.restantes} histoire${state.restantes > 1 ? "s" : ""} encore possible${state.restantes > 1 ? "s" : ""} aujourd'hui.`);
        $("#notice").textContent = notes.join(" ");
      } catch {
        const pill = $("#status");
        pill.textContent = "Miette injoignable";
        pill.className = "pill bad";
      }
    }

    refresh();
    setInterval(() => { if (!busy && !document.hidden) refresh(); }, 20000);
    document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(); });
  </script>
</body>
</html>
